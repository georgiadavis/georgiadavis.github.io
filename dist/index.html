<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Georgia Davis is a designer based in San Francisco, currently building WhatsApp.">
    <title>Georgia Davis — Designer</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="preload" href="assets/fonts/Forevs-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css?v=flash">
  </head>
  <body>
    <main>
      <header class="intro">
        <h1><img class="name-logo" src="assets/georgia-logo.svg" width="364" height="62" alt="Georgia Davis"></h1>
        <p class="intro-text">I’m a designer based in San Francisco, currently building WhatsApp.<br> Before that, I spent time working in the Meta Superintelligence<br> Labs, Reality Labs, Clever, GoFundMe, and Udacity.</p>
      </header>
      <section class="work" aria-label="Selected work">
        <button class="camera-button" type="button" aria-label="Print a Polaroid" title="Print a Polaroid">
          <img class="camera" src="assets/camera.png" width="797" height="817" alt="Vintage instant camera with a rainbow stripe">
        </button>
        <canvas class="print-canvas" aria-hidden="true"></canvas>
        <img class="camera-lip" src="assets/camera.png" width="797" height="817" alt="" aria-hidden="true">
        <div class="camera-flash" aria-hidden="true"></div>
        <div class="photo-stack">
          <figure class="polaroid">
            <img class="project-image" src="assets/photo-1.png" alt="Portrait beside a lily pond">
          </figure>
        </div>
      </section>
    </main>
    <script src="print.js?v=flash" defer></script>
  </body>
</html>
